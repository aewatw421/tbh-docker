name: build-kvm-image

on:
  push:
    branches: [main]
    paths:
      - "kvm/**"
      - ".github/workflows/build-kvm-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tbh-kvm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: kvm/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kvm
          cache-to: type=gha,mode=max,scope=kvm
          provenance: false

      - name: Summary
        run: |
          {
            echo "### tbh-kvm 运行器构建完成"
            echo ""
            echo "注意：构建不需要 KVM，**运行**需要宿主机透传 \`/dev/kvm\`，并自备 Windows 金盘（kvm/make-golden.md）。"
          } >> "$GITHUB_STEP_SUMMARY"
